name: Sync website content

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-website-content
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.WEBSITE_REPO }}
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          submodules: true

      - name: Update content submodule
        run: |
          git submodule update --remote -- content
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if ! git diff --cached --quiet; then
            git commit -m "chore(content): sync docs submodule"
            git push
          fi

      - name: Purge Cloudflare cache
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          [[ "$CF_ZONE_ID" =~ ^[0-9A-Fa-f]{32}$ ]]
          curl --fail --silent --show-error --output /dev/null \
            --retry 3 --max-time 30 \
            --request POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            --header "Authorization: Bearer $CF_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}'
